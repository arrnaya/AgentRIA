name: Update Status

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Refresh the countdown/phase daily even without a push.
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update-status:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate status block
        run: node .github/scripts/update-status.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update live status [skip ci]"
            git push
          else
            echo "No status changes to commit."
          fi
